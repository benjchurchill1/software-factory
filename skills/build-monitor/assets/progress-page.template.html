<meta charset="utf-8">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F3F5F2; --surface:#FFFFFF; --ink:#18201C; --muted:#5A655F; --rule:#DAE0DB; --soft:#EAEEEA;
  --accent:#2B5C8A; --good:#2E7A4A; --warn:#9C6410; --bad:#B03A2B; --run:#2B5C8A;
  --good-bg:#E3F1E8; --warn-bg:#F7ECD9; --bad-bg:#F8E3DF; --run-bg:#E1EAF3;
  --ph-barrier:#6B4C9A; --ph-record:#56647A; --ph-cut:#7D8450; --ph-build:#2B5C8A; --ph-verify:#2F8080;
  --ph-review_wait:#B7832A; --ph-owner_wait:#B03A2B; --ph-unaccounted:#B9C1BC;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0F1412; --surface:#161C19; --ink:#E3E9E5; --muted:#94A19A; --rule:#27312C; --soft:#1D2521;
    --accent:#89B2DB; --good:#6FC08D; --warn:#DFA54B; --bad:#EF7E6A; --run:#89B2DB;
    --good-bg:#17291F; --warn-bg:#2C2214; --bad-bg:#2E1A16; --run-bg:#172433;
    --ph-barrier:#B39DDB; --ph-record:#9AA8BF; --ph-cut:#BFC68A; --ph-build:#89B2DB; --ph-verify:#78C2C2;
    --ph-review_wait:#E2B062; --ph-owner_wait:#EF7E6A; --ph-unaccounted:#46504A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0F1412; --surface:#161C19; --ink:#E3E9E5; --muted:#94A19A; --rule:#27312C; --soft:#1D2521;
  --accent:#89B2DB; --good:#6FC08D; --warn:#DFA54B; --bad:#EF7E6A; --run:#89B2DB;
  --good-bg:#17291F; --warn-bg:#2C2214; --bad-bg:#2E1A16; --run-bg:#172433;
    --ph-barrier:#B39DDB; --ph-record:#9AA8BF; --ph-cut:#BFC68A; --ph-build:#89B2DB; --ph-verify:#78C2C2;
    --ph-review_wait:#E2B062; --ph-owner_wait:#EF7E6A; --ph-unaccounted:#46504A;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:15px/1.5 var(--sans);padding-inline:16px;padding-block:24px 48px}
.wrap{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:28px}
h1,h2{font-family:var(--cond);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:28px;line-height:1.15}
h2{font-size:19px}
.eyebrow{font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
header{display:grid;gap:10px}
.statusline{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;font:500 12px/1 var(--mono);padding:6px 9px;border-radius:999px;background:var(--soft);color:var(--ink);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.9}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.run{background:var(--run-bg);color:var(--run)}
.pill.plain::before{display:none}
section{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:10px}
.sechead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px}

/* road to done */
.done{list-style:none;margin:0;padding:0}
.done li{display:grid;grid-template-columns:24px 1fr auto;gap:4px 12px;align-items:start;padding:14px 16px;border-top:1px solid var(--rule)}
.done li:first-child{border-top:0}
.box{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--muted);display:grid;place-items:center;margin-top:1px}
.box.on{background:var(--good);border-color:var(--good)}
.box.on::after{content:"";width:9px;height:5px;border:2px solid var(--surface);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.done .label{font-weight:500}
.done .detail{grid-column:2/4;font-size:13px;color:var(--muted)}
.done .val{font:500 14px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{grid-column:2/4;height:5px;background:var(--soft);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}
.bar.open i{background:var(--warn)}

/* wave table */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:10px 12px;text-align:left;border-top:1px solid var(--rule);vertical-align:top}
thead th{border-top:0;font:500 11px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.c{text-align:center}
.lane{font:500 13px var(--mono)}
.note{font-size:12.5px;color:var(--muted);margin-top:4px;max-width:46ch}
.tick{color:var(--good);font-weight:600} .none{color:var(--muted)}
.stages{display:flex;flex-wrap:wrap;gap:4px}
.st{font:500 11px/1 var(--mono);padding:5px 6px;border-radius:5px}
.st.held{background:var(--good-bg);color:var(--good)} .st.refuted{background:var(--bad-bg);color:var(--bad)} .st.unknown{background:var(--soft);color:var(--muted)}
.steps{display:flex;flex-wrap:wrap;gap:8px;padding:14px 16px;border-top:1px solid var(--rule);align-items:center}

.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:28px;align-items:start}
.list{list-style:none;margin:0;padding:0}
.list li{padding:12px 16px;border-top:1px solid var(--rule);display:grid;gap:3px}
.list li:first-child{border-top:0}
.list .name{font:500 13px var(--mono)}
.list .why{font-size:13px;color:var(--muted)}
.owner li{grid-template-columns:24px 1fr;column-gap:12px}
.owner .why{grid-column:2}
.owner li.isdone .name{text-decoration:line-through;color:var(--muted)}

/* where the time went */
.tw{padding:16px;display:grid;gap:14px}
.tw .lead{font-size:14px}
.stack{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--soft)}
.stack i{display:block;height:100%}
.stack i.unaccounted{background-image:repeating-linear-gradient(45deg,transparent 0 3px,rgba(0,0,0,.12) 3px 6px)}
.twlegend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted)}
.twlegend b{font:500 12.5px var(--mono);color:var(--ink);font-weight:500}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.twrows{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;font:12px var(--mono);color:var(--muted)}
.twrows .stack{height:10px}

/* history */
.chart{padding:16px}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font:11px var(--mono)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted);padding:0 16px 14px}
.key{display:inline-block;width:12px;height:3px;vertical-align:middle;margin-right:6px;background:var(--accent)}
.key.b{height:10px;width:8px;background:var(--muted);opacity:.45}
.key.r{height:10px;width:8px;background:var(--bad);opacity:.8}
footer{font-size:12.5px;color:var(--muted)}
@media (max-width:560px){ h1{font-size:23px} .done li{padding:12px} }
@media (prefers-reduced-motion:no-preference){ .bar i{transition:width .4s ease} }
</style>

<div class="wrap" id="app"></div>

<script>
const D = /*__DATA__*/null;
const $ = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content; };
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago = (iso) => { const m = Math.round((Date.now() - Date.parse(iso)) / 60000); return isNaN(m) ? '' : m < 90 ? `${m} min ago` : `${Math.round(m/60)} h ago`; };

function render(){
  const app = document.getElementById('app');
  if (!D){ app.append($('<p class="muted">No data embedded. Run progress.py to generate this page.</p>')); return; }
  const w = D.wave, r = D.rows;
  const doneCount = D.done.filter(x => x.done).length;
  const last = w && w.barrier.length ? w.barrier[w.barrier.length - 1] : null;
  const bClass = !last ? 'plain' : last.state === 'green' ? 'good' : last.state === 'red' ? 'bad' : 'run';
  const bText = !last ? 'no barrier yet' : `barrier ${w.n}-${last.attempt} ${last.state}`;

  app.append($(`
  <header>
    <span class="eyebrow">Build progress · generated ${esc(D.generated)} · ${esc(ago(D.generated))}</span>
    <h1>${esc(D.project)}</h1>
    <div class="statusline">
      <span class="pill ${doneCount === D.done.length ? 'good' : 'warn'}">${doneCount} of ${D.done.length} done conditions met</span>
      <span class="pill plain"><span class="num">${r.pass}/${r.total}</span>&nbsp;rows PASS</span>
      ${w ? `<span class="pill plain">wave ${w.n}</span><span class="pill ${bClass}">${esc(bText)}</span>` : ''}
      ${w ? `<span class="pill ${w.pushed ? 'good' : 'warn'}">${w.pushed ? 'trunk pushed' : 'trunk not pushed'}</span>` : ''}
    </div>
    <div class="muted mono" style="font-size:12.5px">trunk ${esc(D.trunk)} @ ${esc(D.trunk_head)}</div>
  </header>`));

  // road to done
  const done = D.done.map(x => {
    const hasNum = x.value !== null && x.value !== undefined && x.target !== null && x.target !== undefined;
    let bar = '';
    if (hasNum){
      const pct = x.target > 0 ? Math.min(100, 100 * x.value / x.target) : (x.value === 0 ? 100 : 0);
      bar = `<div class="bar ${x.done ? '' : 'open'}"><i style="width:${x.target > 0 ? pct : (x.done ? 100 : 12)}%"></i></div>`;
    }
    const val = hasNum ? (x.target > 0 ? `${x.value} / ${x.target}` : `${x.value} → ${x.target}`) : (x.done ? 'yes' : 'not yet');
    return `<li><span class="box ${x.done ? 'on' : ''}" role="img" aria-label="${x.done ? 'done' : 'not done'}"></span>
      <span class="label">${esc(x.label)}</span><span class="val">${esc(val)}</span>${bar}
      ${x.detail ? `<span class="detail">${esc(x.detail)}</span>` : ''}</li>`;
  }).join('');
  const verdicts = Object.entries(r.by_verdict).map(([k,v]) => `<span class="pill plain"><span class="num">${v}</span>&nbsp;${esc(k)}</span>`).join('');
  app.append($(`<section><div class="sechead"><h2>Road to done</h2><span class="eyebrow">the loop stops when every box is ticked</span></div>
    <ul class="done panel">${done}</ul>
    <div class="statusline">${verdicts}</div></section>`));

  // current wave
  if (w){
    const yes = (b) => b ? '<span class="tick" aria-label="yes">✓</span>' : '<span class="none" aria-label="no">·</span>';
    const rows = w.lanes.map(l => `<tr>
      <td><div class="lane">${esc(l.lane)}</div>${l.note ? `<div class="note">${esc(l.note)}</div>` : ''}</td>
      <td class="c">${yes(l.cut)}</td><td class="c">${yes(l.built)}</td>
      <td><div class="stages">${l.review.length ? l.review.map(s => `<span class="st ${s.verdict}">S${s.stage} ${s.verdict === 'held' ? 'held' : s.verdict === 'refuted' ? 'refuted' : '?'}</span>`).join('') : '<span class="none">·</span>'}</div></td>
      <td class="c">${yes(l.approved)}</td><td class="c">${yes(l.merged)}</td></tr>`).join('');
    const attempts = w.barrier.map(b => `<span class="pill ${b.state === 'green' ? 'good' : b.state === 'red' ? 'bad' : 'run'}">${w.n}-${b.attempt} ${b.state}${b.launched ? ' · ' + esc(b.launched.slice(11,16)) + 'Z' : ''}</span>`).join('') || '<span class="muted">no barrier launched</span>';
    const left = Math.max(0, 3 - w.barrier.length);
    app.append($(`<section><div class="sechead"><h2>Wave ${w.n}</h2><span class="eyebrow">${w.lanes.length} lanes · integration ${esc(w.integration)}</span></div>
      <div class="panel"><div class="scroll"><table>
        <thead><tr><th>Lane</th><th class="c">Cut</th><th class="c">Built</th><th>Review stages</th><th class="c">Approved</th><th class="c">Merged</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
        <div class="steps"><span class="eyebrow">Barrier</span>${attempts}
          <span class="muted" style="font-size:13px">${w.barrier.some(b => b.state === 'green') ? '' : left ? `${left} attempt${left > 1 ? 's' : ''} left${left === 1 ? ': the last one removes lanes, never repairs' : ''}` : 'attempts spent'}</span></div>
        <div class="steps"><span class="eyebrow">Record</span>${w.recorded ? '<span class="pill good">recorded</span>' : '<span class="pill plain">not recorded</span>'}
          ${w.pushed ? '<span class="pill good">pushed</span>' : '<span class="pill plain">not pushed</span>'}
          <span class="muted mono" style="font-size:12px">${esc(w.integration_head)}</span></div>
      </div></section>`));
  }

  // queue + owner
  const q = w && w.queue_next.length ? w.queue_next.map(i => `<li><span class="name">${esc(i.name)}</span>${i.why ? `<span class="why">${esc(i.why)}</span>` : ''}</li>`).join('') : '<li class="muted">No queue drafted yet.</li>';
  const owner = D.owner.length ? D.owner.map(i => `<li class="${i.done ? 'isdone' : ''}"><span class="box ${i.done ? 'on' : ''}"></span><span class="name" style="font-family:var(--sans);font-size:14px">${esc(i.item)}</span>${i.detail ? `<span class="why">${esc(i.detail)}</span>` : ''}</li>`).join('') : '<li class="muted">Nothing waiting.</li>';
  const open = D.owner.filter(i => !i.done).length;
  app.append($(`<div class="two">
    <section><div class="sechead"><h2>Next wave queue</h2><span class="eyebrow">${w ? 'wave ' + (w.n + 1) : ''}</span></div><ul class="list panel">${q}</ul></section>
    <section><div class="sechead"><h2>Waiting on ${esc(D.owner_name)}</h2><span class="eyebrow">${open} open</span></div><ul class="list owner panel">${owner}</ul></section>
  </div>`));

  // where the time went
  const T = D.timing;
  if (T && T.error){
    app.append($(`<section><div class="sechead"><h2>Where the time went</h2></div><div class="panel"><div class="tw muted">${esc(T.error)}</div></div></section>`));
  } else if (T && T.waves.length){
    const NAMES = {barrier:'barrier', record:'record', cut:'cutting lanes', build:'building', verify:'verify panels',
                   review_wait:'waiting for review', owner_wait:`waiting on ${D.owner_name}`, unaccounted:'unaccounted'};
    const dur = (m) => m < 90 ? `${Math.round(m)} min` : `${Math.floor(m / 60)} h ${String(Math.round(m % 60)).padStart(2, '0')}`;
    const stack = (w) => `<div class="stack" role="img" aria-label="wave ${w.wave}: ${T.order.filter(k => w.phases[k]).map(k => NAMES[k] + ' ' + dur(w.phases[k])).join(', ')}">${
      T.order.filter(k => w.phases[k]).map(k => `<i class="${k}" style="width:${(100 * w.phases[k] / w.span_min).toFixed(2)}%;background-color:var(--ph-${k})" title="${esc(NAMES[k])}: ${dur(w.phases[k])}"></i>`).join('')}</div>`;
    const W0 = T.waves.find(w => w.current) || T.waves[T.waves.length - 1];
    const topShare = W0.top ? Math.round(100 * W0.phases[W0.top] / W0.span_min) : 0;
    const lead = W0.top
      ? `Wave ${W0.wave}${W0.current ? ' so far' : ''}: ${dur(W0.span_min)}, of which <b>${esc(NAMES[W0.top])}</b> took ${dur(W0.phases[W0.top])} (${topShare}%).`
        + (W0.slowest_build ? ` Slowest build: ${esc(W0.slowest_build.lane)}, ${dur(W0.slowest_build.min)}.` : '')
        + (W0.open.length ? ` Still open: ${W0.open.map(esc).join(', ')}.` : '')
      : `Wave ${W0.wave}: no phases recorded yet.`;
    const legend = T.order.filter(k => W0.phases[k]).map(k => `<span><span class="sw" style="background:var(--ph-${k})"></span>${esc(NAMES[k])} <b>${dur(W0.phases[k])}</b></span>`).join('');
    const recent = T.waves.slice(-12).reverse().map(w => `<span>w${w.wave}</span>${stack(w)}<span>${dur(w.span_min)}</span>`).join('');
    app.append($(`<section><div class="sechead"><h2>Where the time went</h2><span class="eyebrow">each minute goes to the busiest phase active in it</span></div>
      <div class="panel"><div class="tw"><div class="lead">${lead}</div>${stack(W0)}<div class="twlegend">${legend}</div>
      ${T.waves.length > 1 ? `<div class="twrows">${recent}</div>` : ''}</div></div></section>`));
  }

  // history
  const H = D.history;
  if (H.length > 1){
    const W = 720, Ht = 220, L = 38, R = 34, T = 14, B = 30;
    const xs = (i) => L + i * (W - L - R) / (H.length - 1);
    const minP = Math.floor(Math.min(...H.map(h => h.pass)) / 10) * 10;
    const maxP = Math.max(...H.map(h => h.total));
    const ys = (v) => T + (Ht - T - B) * (1 - (v - minP) / (maxP - minP));
    const maxA = Math.max(6, ...H.map(h => h.attempts || 0));
    const ya = (a) => (Ht - B) - (a / maxA) * (Ht - T - B) * 0.45;
    const bw = Math.max(3, (W - L - R) / H.length * 0.5);
    const grid = [minP, Math.round((minP + maxP) / 2), maxP].map(v => `<line x1="${L}" x2="${W - R}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--rule)"/><text x="${L - 6}" y="${ys(v) + 4}" text-anchor="end">${v}</text>`).join('');
    const bars = H.map((h, i) => h.attempts ? `<rect x="${xs(i) - bw/2}" y="${ya(h.attempts)}" width="${bw}" height="${(Ht - B) - ya(h.attempts)}" fill="${h.attempts >= 3 ? 'var(--bad)' : 'var(--muted)'}" opacity="${h.attempts >= 3 ? .75 : .35}"><title>wave ${h.wave}: ${h.attempts} barrier attempt(s)</title></rect>` : '').join('');
    const line = H.map((h, i) => `${i ? 'L' : 'M'}${xs(i).toFixed(1)},${ys(h.pass).toFixed(1)}`).join(' ');
    const area = `${line} L${xs(H.length - 1).toFixed(1)},${Ht - B} L${xs(0).toFixed(1)},${Ht - B} Z`;
    const step = Math.ceil(H.length / 8);
    const labels = H.map((h, i) => ((i % step === 0 && H.length - 1 - i >= step / 2) || i === H.length - 1) ? `<text x="${xs(i)}" y="${Ht - 10}" text-anchor="middle">${h.wave}</text>` : '').join('');
    const lastH = H[H.length - 1];
    const svg = `<svg viewBox="0 0 ${W} ${Ht}" role="img" aria-label="PASS rows and barrier attempts per wave">
      ${grid}${bars}
      <path d="${area}" fill="var(--accent)" opacity=".10"/>
      <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2"/>
      ${H.map((h, i) => `<circle cx="${xs(i)}" cy="${ys(h.pass)}" r="${i === H.length - 1 ? 4 : 2}" fill="var(--accent)"><title>wave ${h.wave}: ${h.pass}/${h.total} PASS (${h.at.slice(0,10)})</title></circle>`).join('')}
      <text x="${xs(H.length - 1) + 6}" y="${ys(lastH.pass) - 8}" text-anchor="end" style="fill:var(--ink)">${lastH.pass}</text>
      ${labels}</svg>`;
    app.append($(`<section><div class="sechead"><h2>History</h2><span class="eyebrow">last ${H.length} green waves</span></div>
      <div class="panel"><div class="chart">${svg}</div>
      <div class="legend"><span><span class="key"></span>rows at PASS</span><span><span class="key b"></span>barrier attempts to green</span><span><span class="key r"></span>three or more</span><span>register total ${maxP}</span></div></div></section>`));
  }

  app.append($(`<footer>Generated from the build's own record (scoreboard, gate ceilings, git, wave evidence). Nothing on this page is typed by hand except the owner's list.</footer>`));
}
render();
</script>
